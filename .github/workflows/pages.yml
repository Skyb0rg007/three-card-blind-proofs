# Build the play site (site/) and deploy it to GitHub Pages:
#   https://skyb0rg007.github.io/three-card-blind-proofs/
# Repository setting needed once: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "rsolver/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the site
        run: site/build.sh

      # The WASM engine must reproduce `rsolver walk` byte for byte, and
      # the targeted traces must match the native build, before deploying.
      - name: Check the engine against rsolver
        run: site/check.sh 5000

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true  # keep .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
